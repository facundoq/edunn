[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edunn"
version = "0.1.7"
description = "An educational implementation of a Keras-like neural network framework."
readme = "README.md"
authors = [
    { name = "Facundo Quiroga", email = "fquiroga@lidi.info.unlp.edu.ar" },
    { name = "Oscar Stanchi" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "colorama",
    "ipython",
    "jupyter",
    "scikit-learn",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

[project.license]
text = "AGPL-3.0-or-later"

[project.urls]
"Bug Tracker" = "https://github.com/facundoq/edunn/issues"
Documentation = "https://github.com/facundoq/edunn"
"Source Code" = "https://github.com/facundoq/edunn"

[dependency-groups]
dev = [
    "pytest",
    "twine",
    "pre-commit",
    "nbconvert",
    "nbformat",
    "ipykernel",
    "manim>=0.20.1",
    "ruff>=0.15.8",
    "ty>=0.0.26",
    "jupytext>=1.19.1",
    "marimo>=0.21.1",
]

[tool.uv]
managed = true

[tool.black]
line-length = 120
target-version = ["py38"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120

[tool.ty]
type-checking = true
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.setuptools.packages.find]
exclude = ["samples*", "guides*", "releases*", "generated*", "tests*"]

[tool.setuptools.package-data]
"edunn.datasets.regression_data" = ["*"]
"edunn.datasets.classification_data" = ["*"]

